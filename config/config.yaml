# sc_pileup — configuration template
#
# The pileup stage is genotype-FREE: it tallies every barcode at every site in
# `sites_vcf`, irrespective of donor. Donor subsetting / assignment happens
# downstream (snp_demux, cardelino, Track B). So this stage needs only a BAM, a
# barcode list, a platform, and a site VCF per capture.

# -- Inputs -- #
deps:
  # One row per capture: capture_id, platform, bam, barcodes  (see config/captures.csv)
  captures: config/captures.csv
  # The sites to pile up. Swap this per purpose:
  #   * germline common-SNP panel  -> feeds vireo/demuxlet/freemuxlet (demux)
  #   * per-donor / merged somatic VCF -> feeds Track A / cardelino
  # Must be bgzipped + indexed (.csi or .tbi), same genome build as the BAMs (GRCh38).
  sites_vcf: /path/to/sites.vcf.gz

# -- Outputs -- #
outs:
  root: results
  logs: logs

# -- Which pileup engines to run -- #
# cellsnp    : cellSNP-lite MEX matrices (AD/DP/OTH + base.vcf.gz + samples.tsv).
#              Primary, reusable artifact; feeds vireo, Track B, cardelino.
# popscle    : popscle dsc-pileup (plp/cel/var/umi). Feeds demuxlet + freemuxlet.
#              Short-read only for now (dsc-pileup assumes 10x-style short reads).
# souporcell : minimap2 remap + vartrix -> ref.mtx/alt.mtx (+barcodes,+variants).
#              The expensive, deterministic half of souporcell; snp_demux resumes
#              from the matrices for clustering/troublet/consensus. See
#              docs/souporcell_split.md. Short-read only for now.
#
# Set this list to pick which engines run. Dropping an engine removes all its
# jobs (Snakemake is pull-based). Unknown names are rejected.
#
# NB: `popscle` feeds demuxlet+freemuxlet, which is the single-threaded, up-to-
# 24 h, job-exploding bottleneck. A cohort-wide eval (138 captures, 1.8M cells)
# showed a vireo+souporcell consensus reproduces ~98.8% of demuxlet+freemuxlet
# assignments (0.01% flips, +2.5% net gain), so `engines: [cellsnp, souporcell]`
# is a strong option — EXCEPT for CD45-sorted/immune-enriched low-coverage pools,
# which lean on freemuxlet. Default keeps popscle pending team sign-off.
engines: [cellsnp, popscle, souporcell]

# -- QC summary metrics -- #
# Additive, downstream-neutral: writes per-capture + cohort coverage metrics
# (CSV) under <outs.root>/qc/. Set false to skip. See workflow/rules/qc.smk.
qc: true

# -- Which VCF each capture piles at (3 modes) -- #
# 1. Global: engines pile at `deps.sites_vcf` (below). Default; correct for a
#    single shared panel or a somatic/Track-A VCF.
# 2. Per-capture external panel: give captures.csv a `sites_vcf` column pointing
#    at a pre-built per-pool panel (e.g. from a bcarc_chromium
#    build_informative_panels stage). This is the production demux path.
# 3. Build in-workflow (below): sc_pileup builds the per-pool panel itself via
#    tools/build_informative_panel.sh -- a STANDALONE convenience. Needs a
#    `donors` column in captures.csv. The same tool is what the orchestration
#    stage calls in batch, so there is one implementation, two entry points.
panel:
  build_in_workflow: false   # mode 3: build per-pool panels here
  # Optional common-SNP backbone (bgzipped+indexed VCF or BED/tab sites file) to
  # intersect against -- harmonises WGS vs microarray-imputed donors onto
  # identical sites. null = no common-SNP restriction. On for demux/Track-B, off
  # for somatic/Track-A.
  common_sites: null
  informative: true          # drop sites not polymorphic among the pool (-c 1:minor)

# -- Parameters -- #
params:
  cellsnp_lite:
    # For a germline common-SNP demux panel use minMAF ~0.01, minCOUNT ~10
    # (matching snp_demux). For a targeted somatic/Track-A pileup use minMAF 0,
    # minCOUNT 1 (keep every site, however rare).
    minMAF: 0.0
    minCOUNT: 1
    # Read-admission QC (pinned to cellSNP-lite's own defaults so they are
    # explicit and version-stable; change to retune). NB the engines' MAPQ
    # defaults differ — cellSNP/popscle 20, vartrix 30 — see docs.
    min_mapq: 20       # --minMAPQ
    min_len: 30        # --minLEN (min mapped read length)
    # Per-platform extra cellsnp-lite flags. Defaults assume 10x CB/UB tags.
    # The `long` row is a documented placeholder to be tuned against real PacBio
    # single-cell BAMs (splice-aware; UMI semantics may differ; see docs).
    platform_args:
      short: ""
      long: ""
  # popscle. `platforms`: which platforms it runs on. The QC values below are
  # pinned to popscle dsc-pileup's own defaults (explicit + version-stable).
  popscle:
    platforms: [short]
    min_mq: 20         # --min-MQ (mapping quality)
    min_bq: 13         # --min-BQ (base quality; popscle is the only engine that filters on BQ)
    cap_bq: 40         # --cap-BQ
    excl_flag: 3844    # --excl-flag (SAM flags excluded)
    extra: ""          # free-form extra dsc-pileup flags
  # souporcell prep (remap + vartrix). vartrix counts at the covered subset of
  # sites_vcf (genotype-free); min_cov = min read depth for a site to be kept
  # (souporcell's min_ref+min_alt, default 20).
  souporcell:
    skip_remap: true   # vartrix on the original BAM (remap validated a no-op)
    min_cov: 20
    platforms: [short]
    mapq: 30           # vartrix --mapq (souporcell's convention; stricter than cellSNP/popscle's 20)
    extra: ""          # free-form extra vartrix flags

# -- Reference dependencies -- #
ref:
  souporcell:
    # Genome FASTA (+ .fai) for minimap2 remap and vartrix. Same build as BAMs.
    genome_fasta: /path/to/refdata-gex-GRCh38-2020-A/fasta/genome.fa

# -- Containers -- #
# Focused per-tool images (public biocontainers / Docker Hub) replacing the
# monolithic Demuxafy.sif. Versions match what Demuxafy.sif shipped so results are
# unchanged. Snakemake pulls docker:// images once into its singularity prefix.
containers:
  cellsnp:    docker://quay.io/biocontainers/cellsnp-lite:1.2.2--hb0d9459_3
  # built from statgen/popscle @ da70fc78 (the commit Demuxafy.sif shipped); the
  # public 0.1beta biocontainer emits a different pileup.umi format. See containers/.
  popscle:    docker://ghcr.io/swarbricklab/sc_pileup-popscle:da70fc78
  samtools:   docker://quay.io/biocontainers/samtools:1.15--h1170115_1
  bcftools:   docker://quay.io/biocontainers/bcftools:1.13--h3a49de5_0
  # The whole souporcell engine (minimap2 remap + renamer/retag, samtools/bcftools
  # covered-variant filter, and vartrix) runs in souporcell's own image — it
  # carries all of them, and its vartrix is the one snp_demux pins (Demuxafy's
  # bundled vartrix panics intermittently).
  souporcell: docker://cumulusprod/souporcell:2.5
