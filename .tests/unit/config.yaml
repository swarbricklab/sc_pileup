# Base config for the unit tests (.tests/unit/test_workflow.py). Each test writes
# a copy with its own overrides into a scratch dir; paths there are absolute.
deps:
  captures: CAPTURES
  sites_vcf: SITES
outs:
  root: OUT
  logs: LOGS
engines: [cellsnp]
qc: false
panel_kind: germline
somatic:
  non_snv: warn
panel:
  build_in_workflow: false
  common_sites: null
  informative: false
params:
  cellsnp_lite:
    minMAF: 0.0
    minCOUNT: 1
    min_mapq: 20
    min_len: 30
    platform_args: {short: "", long: ""}
  popscle:
    platforms: [short]
    min_mq: 20
    min_bq: 13
    cap_bq: 40
    excl_flag: 3844
    extra: ""
  souporcell:
    skip_remap: true
    min_cov: 1
    max_cov: 100000
    platforms: [short]
    mapq: 30
    extra: ""
ref:
  souporcell:
    genome_fasta: GENOME
containers:
  cellsnp:    docker://quay.io/biocontainers/cellsnp-lite:1.2.2--hb0d9459_3
  popscle:    docker://ghcr.io/swarbricklab/sc_pileup-popscle:da70fc78
  samtools:   docker://quay.io/biocontainers/samtools:1.15--h1170115_1
  bcftools:   docker://quay.io/biocontainers/bcftools:1.13--h3a49de5_0
  souporcell: docker://cumulusprod/souporcell:2.5
