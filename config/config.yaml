# sc_pileup — configuration template
#
# The pileup stage is genotype-FREE: it tallies every barcode at every site in
# `sites_vcf`, irrespective of donor. Donor subsetting / assignment happens
# downstream (snp_demux, cardelino, Track B). So this stage needs only a BAM, a
# barcode list, a platform, and a site VCF per capture.

# -- Inputs -- #
deps:
  # One row per capture: capture_id, platform, bam, barcodes  (see config/captures.csv)
  captures: config/captures.csv
  # The sites to pile up. Swap this per purpose:
  #   * germline common-SNP panel  -> feeds vireo/demuxlet/freemuxlet (demux)
  #   * per-donor / merged somatic VCF -> feeds Track A / cardelino
  # Must be bgzipped + indexed (.csi or .tbi), same genome build as the BAMs (GRCh38).
  sites_vcf: /path/to/sites.vcf.gz

# -- Outputs -- #
outs:
  root: results
  logs: logs

# -- Which pileup engines to run -- #
# cellsnp    : cellSNP-lite MEX matrices (AD/DP/OTH + base.vcf.gz + samples.tsv).
#              Primary, reusable artifact; feeds vireo, Track B, cardelino.
# popscle    : popscle dsc-pileup (plp/cel/var/umi). Feeds demuxlet + freemuxlet.
#              Short-read only for now (dsc-pileup assumes 10x-style short reads).
# souporcell : minimap2 remap + vartrix -> ref.mtx/alt.mtx (+barcodes,+variants).
#              The expensive, deterministic half of souporcell; snp_demux resumes
#              from the matrices for clustering/troublet/consensus. See
#              docs/souporcell_split.md. Short-read only for now.
#
# Set this list to pick which engines run. Dropping an engine removes all its
# jobs (Snakemake is pull-based). Unknown names are rejected.
#
# NB: `popscle` feeds demuxlet+freemuxlet, which is the single-threaded, up-to-
# 24 h, job-exploding bottleneck. A cohort-wide eval (138 captures, 1.8M cells)
# showed a vireo+souporcell consensus reproduces ~98.8% of demuxlet+freemuxlet
# assignments (0.01% flips, +2.5% net gain), so `engines: [cellsnp, souporcell]`
# is a strong option — EXCEPT for CD45-sorted/immune-enriched low-coverage pools,
# which lean on freemuxlet. Default keeps popscle pending team sign-off.
engines: [cellsnp, popscle, souporcell]

# -- Optional per-pool informative panel -- #
# When `informative_filter: true`, engines do NOT pile at `sites_vcf` directly.
# Instead, per capture, `sites_vcf` (which must then be a cohort donor-genotype
# VCF) is subset to the pool's donors (captures.csv `donors` column, ';'-separated
# sample names matching sites_vcf) and filtered to sites polymorphic among them
# (bcftools view -c 1:minor). See rules/panel.smk. The resulting
# results/panel/<capture>/informative.vcf.gz is ALSO the file snp_demux should
# point deps.vcf at -> the pileup sites and the demux genotypes stay identical by
# construction. Leave FALSE for somatic / Track-A pileups (no donor subsetting).
panel:
  informative_filter: false

# -- Parameters -- #
params:
  cellsnp_lite:
    # For a germline common-SNP demux panel use minMAF ~0.01, minCOUNT ~10
    # (matching snp_demux). For a targeted somatic/Track-A pileup use minMAF 0,
    # minCOUNT 1 (keep every site, however rare).
    minMAF: 0.0
    minCOUNT: 1
    # Per-platform extra cellsnp-lite flags. Defaults assume 10x CB/UB tags.
    # The `long` row is a documented placeholder to be tuned against real PacBio
    # single-cell BAMs (splice-aware; UMI semantics may differ; see docs).
    platform_args:
      short: ""
      long: ""
  # popscle applicability: which platforms it runs on.
  popscle:
    platforms: [short]
  # souporcell prep (remap + vartrix). vartrix counts at the covered subset of
  # sites_vcf (genotype-free); min_cov = min read depth for a site to be kept
  # (souporcell's min_ref+min_alt, default 20).
  souporcell:
    skip_remap: true   # vartrix on the original BAM (remap validated a no-op)
    min_cov: 20
    platforms: [short]

# -- Reference dependencies -- #
ref:
  souporcell:
    # Genome FASTA (+ .fai) for minimap2 remap and vartrix. Same build as BAMs.
    genome_fasta: /path/to/refdata-gex-GRCh38-2020-A/fasta/genome.fa

# -- Containers -- #
containers:
  # Reuse the demuxafy image that snp_demux uses — it carries cellsnp-lite,
  # popscle, bcftools, samtools AND the souporcell remap tools (minimap2 2.7,
  # renamer.py/retag.py under /opt/souporcell). No network pull.
  demuxafy: resources/Demuxafy.sif
  # souporcell VARTRIX runs here, NOT in Demuxafy — Demuxafy's bundled vartrix
  # panics intermittently, which is exactly why snp_demux pins this image.
  # Pre-pull to a local .sif (e.g. resources/souporcell_2.5.sif) to avoid a
  # compute-node network pull.
  souporcell: docker://cumulusprod/souporcell:2.5
