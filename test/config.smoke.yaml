# Smoke-test config: one real short-read capture from bcarc_chromium, germline
# panel as sites. For DAG validation / a single-capture run.
deps:
  captures: test/captures.smoke.csv
  sites_vcf: /scratch/a56/jr9959/bcarc_chromium/data/snp/vcf/donor_keyed.vcf.gz

outs:
  root: results
  logs: logs

engines: [cellsnp, popscle]

params:
  cellsnp_lite:
    minMAF: 0.01
    minCOUNT: 10
    platform_args:
      short: ""
      long: ""
  popscle:
    platforms: [short]

containers:
  demuxafy: /scratch/a56/jr9959/bcarc_chromium/resources/Demuxafy.sif
