# sc_pileup CI / reproducibility test config — runs ALL THREE engines
# (cellsnp, popscle, souporcell) on a small PUBLIC fixture.
#
# Fixtures (.tests/integration/data/, DVC-tracked) are regenerated by .tests/integration/make_test_fixtures.sh
# from a public source: Demuxafy's "TestData4PipelineSmall" — the OneK1K 14-donor
# PBMC pool (Neavin et al., Powell Lab). The BAM is subsampled to 10% of reads and
# its contigs renamed Ensembl->UCSC `chr`-style (to match the genome FASTA); the
# site VCF is the 14-donor genotyped panel (autosomal, sorted to the BAM's @SQ
# order). cellsnp-lite and popscle use only its positions; the genotypes flow
# through souporcell's variants.vcf and are consumed downstream by snp_demux
# (genotype-aware clustering), which runs on THIS pileup.
#
# The per-tool biocontainers are pulled once into the singularity prefix; the
# souporcell image and the genome FASTA are NCI-resident inputs the CI environment
# provides (too large to track per-repo), at the shared a56 locations below.
deps:
  captures: .tests/integration/captures.full.csv
  sites_vcf: ../demuxafy_testdata/full/fixture/sites.vcf.gz

outs:
  root: results/full_neavin
  logs: logs/full_neavin

engines: [cellsnp]

panel:
  build_in_workflow: false
  common_sites: null
  informative: false

params:
  cellsnp_lite:
    # Keep every site with >=1 read (the fixture is deliberately low-coverage).
    minMAF: 0.1
    minCOUNT: 20
    min_mapq: 20
    min_len: 30
    platform_args:
      short: ""
      long: ""
  popscle:
    platforms: [short]
    min_mq: 20
    min_bq: 13
    cap_bq: 40
    excl_flag: 3844
    extra: ""
  souporcell:
    skip_remap: true    # vartrix on the original BAM (remap validated a no-op)
    min_cov: 2          # low, to match the small fixture's coverage
    platforms: [short]
    mapq: 30
    extra: ""

ref:
  souporcell:
    genome_fasta: resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers:
  cellsnp:    docker://quay.io/biocontainers/cellsnp-lite:1.2.2--hb0d9459_3
  popscle:    docker://ghcr.io/swarbricklab/sc_pileup-popscle:da70fc78
  samtools:   docker://quay.io/biocontainers/samtools:1.15--h1170115_1
  bcftools:   docker://quay.io/biocontainers/bcftools:1.13--h3a49de5_0
  # reuse the already-staged local .sif to avoid a 1.5 GB re-pull in CI
  souporcell: /g/data/a56/software/singularity/images/souporcell_2.5.sif
