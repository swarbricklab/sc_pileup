$schema: "http://json-schema.org/draft-07/schema#"
description: >-
  sc_pileup configuration. Validated at workflow start via
  snakemake.utils.validate() in the Snakefile.
type: object
properties:
  deps:
    type: object
    properties:
      captures:
        type: string
        description: Path to captures.csv (capture_id, platform, bam, barcodes; optional donors, sites_vcf, panel_kind, raw_matrix).
      sites_vcf:
        type: string
        description: Path to the sites VCF the pileups are counted at (unless built in-workflow).
    required: [captures, sites_vcf]
    additionalProperties: false
  outs:
    type: object
    properties:
      root: {type: string, description: Root for all data outputs.}
      logs: {type: string, description: Root for per-rule logs.}
    required: [root, logs]
    additionalProperties: false
  engines:
    type: array
    description: Which pileup engines to run.
    items:
      type: string
      enum: [cellsnp, popscle, souporcell]
  barcode_sets:
    type: array
    description: >-
      Barcode sets to pile up per capture. `cells` (default) keeps the existing
      paths; `empties` (empty droplets, needs a raw_matrix column) runs cellsnp
      only, into results/empties/cellsnp/<platform>/<capture_id>/.
    items:
      type: string
      enum: [cells, empties]
    minItems: 1
    default: [cells]
  qc:
    type: boolean
    description: Whether to emit per-engine QC metrics.
  panel_kind:
    type: string
    enum: [germline, somatic]
    default: germline
    description: >-
      Kind of site VCF the captures are piled at. `somatic` refuses the germline-
      only panel filters (panel.build_in_workflow / informative / common_sites)
      and checks the VCF for non-biallelic-SNV records before piling up.
      Overridable per capture with a `panel_kind` column in captures.csv.
  somatic:
    type: object
    properties:
      non_snv:
        type: string
        enum: [warn, drop]
        default: warn
        description: >-
          What to do with records that are not biallelic SNVs in a somatic site
          VCF: `warn` (report and keep) or `drop` (pile at a biallelic-SNV subset).
    additionalProperties: false
  panel:
    type: object
    properties:
      build_in_workflow: {type: boolean}
      common_sites: {type: ["string", "null"]}
      informative: {type: boolean}
    additionalProperties: false
  params:
    type: object
    properties:
      cellsnp_lite:
        type: object
        properties:
          minMAF: {type: number}
          minCOUNT: {type: integer}
          min_mapq: {type: integer}
          min_len: {type: integer}
          platform_args:
            type: object
            propertyNames: {enum: [short, long]}
          platform_params:
            type: object
            description: >-
              Per-platform overrides of min_mapq / min_len (fall back to the
              global values when absent or null). Keys must be a platform
              (short | long), so a typo fails validation instead of being
              silently ignored.
            propertyNames: {enum: [short, long]}
            additionalProperties:
              type: ["object", "null"]
              properties:
                min_mapq: {type: ["integer", "null"]}
                min_len: {type: ["integer", "null"]}
              additionalProperties: false
        required: [minMAF, minCOUNT, min_mapq, min_len]
      empties:
        type: object
        properties:
          umi_window:
            type: array
            items: {type: integer, minimum: 0}
            minItems: 2
            maxItems: 2
            description: >-
              Inclusive [min, max] Gene Expression UMI total for a non-cell
              barcode to count as an empty droplet.
        additionalProperties: false
      read_filter:
        type: ["object", "null"]
        description: >-
          Optional nM/NH read pre-filter for the cellsnp engine (null/absent = off).
          Reads lacking the tag are kept.
        properties:
          max_nM: {type: ["integer", "null"], minimum: 0}
          max_NH: {type: ["integer", "null"], minimum: 1}
        additionalProperties: false
      popscle:
        type: object
        properties:
          platforms: {type: array, items: {type: string}}
          min_mq: {type: integer}
          min_bq: {type: integer}
          cap_bq: {type: integer}
          excl_flag: {type: integer}
          extra: {type: string}
        required: [platforms, min_mq, min_bq, cap_bq, excl_flag, extra]
      souporcell:
        type: object
        properties:
          skip_remap: {type: boolean}
          min_cov: {type: integer}
          max_cov: {type: integer}
          platforms: {type: array, items: {type: string}}
          mapq: {type: integer}
          extra: {type: string}
        required: [min_cov, max_cov]
    required: [cellsnp_lite, popscle]
  ref:
    type: object
    properties:
      souporcell:
        type: object
        properties:
          genome_fasta: {type: string}
        required: [genome_fasta]
  containers:
    type: object
    properties:
      cellsnp: {type: string}
      popscle: {type: string}
      samtools: {type: string}
      # optional; default in rules/common.smk (SAMTOOLS_DEPTH_CONTAINER)
      samtools_depth: {type: string}
      bcftools: {type: string}
      souporcell: {type: string}
    required: [cellsnp, popscle, samtools, bcftools, souporcell]
    additionalProperties: false
required: [deps, outs, params, containers]
