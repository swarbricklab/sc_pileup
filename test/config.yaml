# sc_pileup CI / reproducibility test config — runs ALL THREE engines
# (cellsnp, popscle, souporcell) on a small PUBLIC fixture.
#
# Fixtures (test/data/, DVC-tracked) are regenerated by test/make_test_fixtures.sh
# from public sources:
#   * a tiny_pbmc cellranger BAM (chromium-preprocessing public test data),
#     subset to chr19:1-10,000,000 + chr22:20,000,000-30,000,000;
#   * the souporcell IGSR/1000G GRCh38 common-SNP panel, subset to the same two
#     windows (contigs renamed to the cellranger `chr`-style to match the BAM).
# The pileup is genotype-FREE, so the site VCF is just a set of positions — no
# donor genotypes are needed (those live downstream in snp_demux).
#
# The per-tool biocontainers are pulled once into the singularity prefix; the
# souporcell image and the genome FASTA are NCI-resident inputs the CI environment
# provides (too large to track per-repo), at the shared a56 locations below.
deps:
  captures: test/captures.csv
  sites_vcf: test/data/sites.vcf.gz

outs:
  root: results/test
  logs: logs/test

engines: [cellsnp, popscle, souporcell]

panel:
  build_in_workflow: false
  common_sites: null
  informative: false

params:
  cellsnp_lite:
    # Keep every site with >=1 read (the fixture is deliberately low-coverage).
    minMAF: 0.0
    minCOUNT: 1
    min_mapq: 20
    min_len: 30
    platform_args:
      short: ""
      long: ""
  popscle:
    platforms: [short]
    min_mq: 20
    min_bq: 13
    cap_bq: 40
    excl_flag: 3844
    extra: ""
  souporcell:
    skip_remap: true    # vartrix on the original BAM (remap validated a no-op)
    min_cov: 2          # low, to match the small fixture's coverage
    platforms: [short]
    mapq: 30
    extra: ""

ref:
  souporcell:
    genome_fasta: /scratch/a56/jr9959/bcarc_chromium/resources/transcriptomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers:
  cellsnp:    docker://quay.io/biocontainers/cellsnp-lite:1.2.2--hb0d9459_3
  popscle:    docker://ghcr.io/swarbricklab/sc_pileup-popscle:da70fc78
  samtools:   docker://quay.io/biocontainers/samtools:1.15--h1170115_1
  bcftools:   docker://quay.io/biocontainers/bcftools:1.13--h3a49de5_0
  # reuse the already-staged local .sif to avoid a 1.5 GB re-pull in CI
  souporcell: /g/data/a56/software/singularity/images/souporcell_2.5.sif
