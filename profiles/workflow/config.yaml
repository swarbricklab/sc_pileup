# Workflow profile (snakemake 7.x)
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 2

# Cap simultaneous cluster submissions well under the global profile's 1000. On a
# big cohort the popscle path fans out per-chromosome (~22 chrom x N captures =
# thousands of jobs), which can blow a shared NCI simultaneous-job quota. This
# throttles how many are queued at once (total work is unchanged). Override per
# run via $@, e.g. `--jobs 200`.
jobs: 500

# Job grouping: collapse each capture-chromosome popscle chain -- split_bam +
# split_vcf -> dsc_pileup -> wrangle_plp / wrangle_umi -- into ONE cluster job per
# (capture, chromosome) connected component, instead of five separate submissions.
# This removes the thousands of tiny split/wrangle jobs that make up the per-chrom
# fan-out; the group's resources are dominated by dsc_pileup (64 GB / 240 min), the
# other four being 2-4 GB / <=20 min. NB: no `group-components` here -- batching
# multiple chromosomes into one job needs walltime/mem tuning and is a separate
# change.
groups:
  split_bam_by_chromosome: popscle_chr
  split_vcf_by_chromosome: popscle_chr
  dsc_pileup_by_chromosome: popscle_chr
  wrangle_plp_by_chromosome: popscle_chr
  wrangle_umi_by_chromosome: popscle_chr

use-conda: True
conda-frontend: mamba

# Per-rule threads live here (not in the rule). cellSNP-lite reads it as
# {resources.threads} in its shell; everything else defaults to 1 thread.
# NB: set as a `threads` *resource* (not snakemake's `set-threads:`) because in
# snakemake 7.32.4 set-threads does not propagate to the {threads} placeholder
# for a rule that declares no threads directive; the resources route does.
#
# Queue: the four heavy pileup rules (both cellsnp rules, the souporcell
# covered-variant scan and vartrix) set `queue: normalsr`, which the global
# profile's pbs_submit.py passes to qsub -q; every other rule goes to normal.
# normalsr has newer CPUs and charges the same 2 SU per CPU-hour as normal.
# Two captures, run on both queues at the same time with cellsnp-lite on 32
# threads and vartrix on 16, wrote identical output, and their cellsnp-lite,
# scan and vartrix jobs cost 13, 15 and 22 per cent less on normalsr (19 per
# cent over the three rules). Every job started within two minutes on either
# queue.
# One earlier test job failed once at container start (retries: 2 covers
# that). The queue is set per rule, not under default-resources, which would
# replace the global profile's whole default list. normalsr is a queue of NCI
# Gadi; a profile for another cluster sets its own queue or drops the key.
set-resources:
  # 32 threads, kept for speed. In a cohort re-pile of 138 captures,
  # cellsnp-lite kept a median of 44 per cent of these CPUs busy, for 682.7 SU.
  # Two cheaper, slower settings were measured and can be swapped in when SU
  # is tight. Both keep 32GB, which 8 CPUs carry at no extra charge, and both
  # wrote identical files. With `threads: 16` each job ran 1.2 to 1.9 times
  # longer on four of those captures, and a pass is projected at 498 SU; it
  # saves little where 32 threads were already half busy. With `threads: 8`
  # each job ran 1.7 to 3.1 times longer on six captures, for 27 per cent less
  # charge (32.6 against 44.7 SU), and a pass is projected at 418 SU.
  # CPU time follows BAM size (about 60 CPU-s per GB, about 10 times that on a
  # 6-million-site panel) and not the threads. Resident memory stays under 1 GB.
  cellsnp_pileup:
    threads: 32  # cheaper and slower: 16 or 8 (see above)
    mem: "32GB"
    runtime: 1440
    queue: normalsr
  # Soup pileup over the empty-droplet barcodes (barcode_sets: empties). Same
  # BAM pass as cellsnp_pileup, more (but sparser) barcodes. The cheaper
  # settings above were not timed on this rule.
  cellsnp_pileup_empties:
    threads: 32  # cheaper and slower: 16 or 8, as for cellsnp_pileup
    mem: "32GB"
    runtime: 1440
    queue: normalsr
  read_filter_bam:
    threads: 4
    mem: "8GB"
    runtime: 240
  souporcell_remap:
    threads: 32
    mem: "128GB"
    runtime: 1440
  # One BAM pass of `samtools depth -b` at the positions the site VCF is tested
  # at (scripts/covered_variants.sh), in containers.samtools_depth (samtools
  # 1.22 by default). On 1.22 its CPU time follows BAM size, from 40 CPU-s on a
  # 1.5 GB BAM to 937 on a 145 GB one (about 6.5 more per GB), and a
  # 6-million-site panel adds about 70 CPU-s. The job keeps its one CPU busy
  # and peaks at 105 MB. 4GB is within what one CPU carries at no extra charge,
  # so the job is charged for one CPU over its walltime. samtools 1.15 gives
  # the same output 11 to 38 times more slowly on panels of about 200,000 sites
  # and 13 per cent more slowly on a 6-million-site panel; 1.16 to 1.21 were
  # not timed. 480 min leaves room for an older samtools, whose time on the
  # largest BAMs was not measured; walltime that is not used is not charged.
  souporcell_covered_variants:
    threads: 1
    mem: "4GB"
    runtime: 480
    queue: normalsr
  # 16 threads and 32GB, kept for speed. In a cohort re-pile of 138 captures,
  # vartrix kept a median of 41 per cent of these CPUs busy, for 1,935.6 SU.
  # Two cheaper, slower settings were measured and can be swapped in when SU
  # is tight. Both wrote identical ref.mtx, alt.mtx and barcodes.tsv. With
  # `threads: 8`, which keeps 32GB at no extra charge, each job ran 1.2 to 1.6
  # times longer on four of those captures, and a pass is projected at
  # 1,279 SU. `threads: 4` needs `mem: "16GB"`, because 32GB on 4 CPUs is
  # charged as 8; each job ran 1.6 to 3.1 times longer on six captures, for
  # half the charge (50.9 against 100.4 SU), and a pass is projected at 936 SU.
  # CPU time follows BAM size (about 210 CPU-s per GB, 2 to 3 times that on a
  # 6-million-site panel) and not the threads, so the charge is 2 SU per CPU
  # hour divided by the share of CPUs busy. Resident memory grows with CPU
  # time, by 0.5 to 0.8 GB per CPU hour on the longer jobs, to 5.65 GB at most.
  souporcell_vartrix:
    threads: 16  # cheaper and slower: 8, or 4 with mem "16GB" (see above)
    mem: "32GB"
    runtime: 720
    queue: normalsr
  split_bam_by_chromosome:
    threads: 1
    mem: "2GB"
    runtime: 20
  split_vcf_by_chromosome:
    threads: 1
    mem: "2GB"
    runtime: 10
  dsc_pileup_by_chromosome:
    threads: 1
    mem: "64GB"
    runtime: 240
  merge_cel:
    threads: 1
    mem: "4GB"
  merge_var:
    threads: 1
    mem: "4GB"
  wrangle_plp_by_chromosome:
    threads: 1
    mem: "4GB"
    # Explicit (small) runtime: this rule is grouped into popscle_chr, and the
    # group's walltime sums its members' runtimes -- without this it would inherit
    # the 600 min default and inflate the group's request. It just stacks the
    # per-chrom PLP (seconds-minutes).
    runtime: 15
  merge_plp:
    threads: 1
    mem: "4GB"
  wrangle_umi_by_chromosome:
    threads: 1
    mem: "4GB"
    # Explicit (small) runtime -- grouped into popscle_chr (see wrangle_plp).
    runtime: 15
  merge_umi:
    threads: 1
    mem: "4GB"
