name: CI

# Lightweight, data-independent checks that run on GitHub-hosted runners (and on
# forks), complementing the heavy NCI reproduction test in pr-validation.yml.
# They need no real BAMs/sites, so they run on every push/PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ci
          # snakefmt + go-shfmt pinned so the format check is reproducible
          # (snakefmt formats shell: blocks via shfmt, so both must match).
          create-args: >-
            snakemake=7.32.4
            snakefmt=2.1.0
            go-shfmt=3.14.1
            pandas
            jsonschema
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: Touch placeholder inputs
        run: bash .tests/ci/setup_placeholders.sh

      - name: Dry-run (builds the full DAG + validates config against the schema)
        run: >-
          snakemake -n
          --snakefile workflow/Snakefile
          --workflow-profile profiles/workflow
          --configfile .tests/ci/config.yaml

      - name: snakefmt check
        run: snakefmt --check workflow/

      - name: snakemake lint (informational)
        continue-on-error: true
        run: snakemake --lint --snakefile workflow/Snakefile --configfile .tests/ci/config.yaml
