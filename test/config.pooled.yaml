# Pooled-capture smoke config (Neomet_Pool028a, 6 donors) — all three engines.
deps:
  captures: test/captures.pooled.csv
  sites_vcf: /scratch/a56/jr9959/bcarc_chromium/data/snp/vcf/donor_keyed.vcf.gz

outs:
  root: results
  logs: logs

engines: [cellsnp, popscle, souporcell]

params:
  cellsnp_lite:
    minMAF: 0.01
    minCOUNT: 10
    platform_args:
      short: ""
      long: ""
  popscle:
    platforms: [short]
  souporcell:
    min_cov: 20
    platforms: [short]

ref:
  souporcell:
    genome_fasta: /scratch/a56/jr9959/bcarc_chromium/resources/transcriptomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers:
  demuxafy: /scratch/a56/jr9959/bcarc_chromium/resources/Demuxafy.sif
  souporcell: docker://cumulusprod/souporcell:2.5
