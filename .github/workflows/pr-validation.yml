name: PR Validation

# Reproducibility CI for sc_pileup. Runs on the self-hosted NCI qxub-runner
# (the pileup engines live in large singularity images that only exist on NCI):
#   1. clone      — clone the PR branch to NCI scratch + wire up DVC (qxub-checkout)
#   2. reproduce  — dvc pull the fixture + golden, run ALL THREE engines on the
#                   fixture, and content-compare the fresh output to the golden
#                   (run_test.sh --check)
#   3. cleanup    — remove the per-PR scratch clone
#
# Gated on fork == false: forks cannot use the self-hosted runner or the NCI creds.

on:
  pull_request:
    branches: [main]

jobs:
  clone:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: qxub-runner
    permissions:
      contents: read
      pull-requests: write
    outputs:
      clone-dir: ${{ steps.checkout.outputs.clone-dir }}
    steps:
      - name: Checkout on NCI (DVC-aware)
        id: checkout
        uses: swarbricklab/ci/qxub-checkout@main
        with:
          nci-user: ${{ secrets.USER_NAME }}
          repository: ${{ github.event.repository.name }}
          pr-number: ${{ github.event.pull_request.number }}
          run-id: ${{ github.run_id }}
          branch-ref: ${{ github.head_ref }}
          dvc-mod: dt
          github-token: ${{ github.token }}

  reproduce:
    needs: clone
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: qxub-runner
    permissions:
      pull-requests: write
    steps:
      - name: Pull fixture + golden
        shell: bash
        run: |
          set -euo pipefail
          CLONE="${{ needs.clone.outputs.clone-dir }}"
          qxub exec -v --queue copyq --mod dt --execdir "$CLONE" \
            -- dt pull test/data.dvc test/golden.dvc

      - name: Run all three engines and compare to golden
        shell: bash
        run: |
          set -euo pipefail
          CLONE="${{ needs.clone.outputs.clone-dir }}"
          # run_test.sh activates the snakemake conda env and loads singularity
          # itself; source conda first so `conda` is on PATH on the compute node.
          qxub exec -v --queue normal --mem 32GB --cpus 4 --execdir "$CLONE" \
            -- bash -lc 'source /g/data/a56/conda/miniconda/etc/profile.d/conda.sh && ./run_test.sh --check --retries 0'

  cleanup:
    needs: [clone, reproduce]
    if: ${{ always() && github.event.pull_request.head.repo.fork == false }}
    runs-on: qxub-runner
    steps:
      - name: Remove per-PR scratch clone
        uses: swarbricklab/ci/qxub-cleanup@main
        with:
          nci-user: ${{ secrets.USER_NAME }}
          repository: ${{ github.event.repository.name }}
          pr-number: ${{ github.event.pull_request.number }}
